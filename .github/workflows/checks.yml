# Repo checks (tools/check.mjs: service-worker rules, wrangler settings, Worker tests) on every PR and push to main.
name: checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: flamingbeing/app-devkit/setup-node@v1
      - run: node tools/check.mjs
